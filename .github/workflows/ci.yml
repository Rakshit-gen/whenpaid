name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whenpaid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/whenpaid_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The sources matrix is generated from src/policy.rs; fail if someone edited one without the other.
      - run: cargo run --quiet -- rules --markdown > /tmp/SOURCES.md && diff -u docs/SOURCES.md /tmp/SOURCES.md
      # The sample report is checked in; fail if the engine's output changed without updating it.
      - run: cargo run --quiet --example generate -- sample | diff -u examples/merchant.json -
